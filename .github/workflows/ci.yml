name: ci
on:
  push:
  pull_request:
jobs:
  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: node --experimental-strip-types --check src/server.ts && node --experimental-strip-types --check src/worker.ts && node --experimental-strip-types --check src/eval.ts && node --experimental-strip-types --check src/replay.ts
      - run: npm test
      - run: npm run eval
        continue-on-error: true
      - run: docker build -t app:ci .
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: app
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
