# Só para o GitHub Codespace de teste (scripts/codespace-up.sh). Nunca use na VPS.
# Publica no localhost do Codespace; o Codespaces encaminha as portas 3000, 8080 e 8081.
services:
  evolution:
    ports: ["127.0.0.1:8080:8080"]
    environment:
      SERVER_URL: http://evolution:8080   # o Chatwoot chama a Evolution pela rede interna
      CHATWOOT_BOT_CONTACT: "false"       # sem contato-robô com QR na inbox (a IA responderia a ele)
      CHATWOOT_MESSAGE_READ: "true"
  api:
    ports: ["127.0.0.1:8081:8080"]
